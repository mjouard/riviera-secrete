<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte des 27 lieux — Riviera Secrète</title>
<meta name="description" content="Carte interactive des 27 lieux insolites de la Côte d'Azur, de Menton à Saint-Tropez, avec filtres par zone.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://riviera-secrete.netlify.app/carte.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<style>
  .map-page{ padding:26px 0 0; }
  .map-head{ margin-bottom:18px; }
  .map-head h1{ font-size:clamp(1.6rem,3vw,2.2rem); margin-bottom:8px; }
  .map-head p{ color:var(--text-muted); max-width:60ch; }
  #map-full{
    width:100%; height:min(72vh, 720px); min-height:420px;
    border-radius:3px; border:1px solid var(--line);
    margin:20px 0 8px;
  }
  .legend{
    display:flex; flex-wrap:wrap; gap:8px 18px;
    padding:16px 0 40px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
  }
  .legend-item{
    display:flex; align-items:center; gap:8px; cursor:pointer;
    color:var(--text-muted); user-select:none;
  }
  .legend-item input{ accent-color:var(--terracotta); cursor:pointer; }
  .legend-dot{ width:11px; height:11px; border-radius:50%; display:inline-block; flex-shrink:0; }

  .leaflet-tile-pane{ filter:invert(100%) hue-rotate(180deg); }
  .map-info-card{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%) translateY(10px); width:min(300px,calc(100% - 40px)); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,0.65); overflow:hidden; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.18s ease,transform 0.18s ease; }
  .map-info-card.is-open{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  .map-info-close{ position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:rgba(12,17,22,0.75); border:none; color:#fff; font-size:0.9rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2; backdrop-filter:blur(4px); }
  .map-info-img{ width:100%; height:140px; object-fit:cover; display:block; }
  .map-info-body{ padding:12px 14px 14px; }
  .map-info-region{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--azure); display:block; margin-bottom:3px; }
  .map-info-name{ font-family:'Fraunces',serif; font-weight:600; font-size:1rem; display:block; margin-bottom:6px; }
  .map-info-intro{ font-size:0.82rem; color:var(--text-muted); margin:0 0 10px; line-height:1.45; }
  .map-info-link{ font-family:'IBM Plex Mono',monospace; font-size:0.75rem; letter-spacing:0.03em; color:var(--terracotta); text-decoration:none; font-weight:500; }
  .map-info-link:hover{ text-decoration:underline; }

</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="index.html">Côte <em>d'Azur</em></a>
    <nav aria-label="Navigation principale">
      <a href="itineraires.html">Itinéraires</a>
      <a href="index.html#lieux">Lieux</a>
    </nav>
  </div>
</header>

<section class="map-page">
  <div class="wrap">
    <div class="map-head">
      <h1>La carte des 27 lieux</h1>
      <p>Clique sur un marqueur pour voir le lieu, ou décoche une zone dans la légende pour l'isoler.</p>
    </div>

    <div id="map-full" role="application" aria-label="Carte interactive des 27 lieux de la Côte d'Azur"></div>

    <div class="legend">
        <label class="legend-item" data-region="menton-monaco" data-map="legend-full">
          <input type="checkbox" checked>
          <span class="legend-dot" style="background:#E8A33D"></span>
          Menton, Monaco & la frontière
        </label>
        <label class="legend-item" data-region="nice" data-map="legend-full">
          <input type="checkbox" checked>
          <span class="legend-dot" style="background:#4FC3C9"></span>
          Nice et ses environs immédiats
        </label>
        <label class="legend-item" data-region="arriere-pays" data-map="legend-full">
          <input type="checkbox" checked>
          <span class="legend-dot" style="background:#8FBF6B"></span>
          L'arrière-pays : villages perchés & gorges
        </label>
        <label class="legend-item" data-region="antibes-cannes" data-map="legend-full">
          <input type="checkbox" checked>
          <span class="legend-dot" style="background:#E88B4F"></span>
          Antibes, Cannes & le massif de l'Estérel
        </label>
        <label class="legend-item" data-region="golfe-st-tropez" data-map="legend-full">
          <input type="checkbox" checked>
          <span class="legend-dot" style="background:#C97FA0"></span>
          Grasse & le golfe de Saint-Tropez
        </label>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>© 2026 Riviera Secrète — carnet de repérage, pas un guide officiel.</p>
    <p><a href="index.html">← Retour à l'accueil</a></p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  (function() {

c de falaise calcaire, avec l'une des plus…"}, {"name": "Le village de Roquebrune-Cap-Martin", "commune": "Roquebrune-Cap-Martin", "lat": 43.7647, "lng": 7.4967, "region": "menton-monaco", "color": "#E8A33D", "url": "lieux/roquebrune-cap-martin-village.html", "img": "assets/images/lieux/roquebrune-cap-martin-village/thumb.jpg", "intro": "Un village médiéval qui grimpe en cercles concentriques autour de son donjon carolingien, l'un des p…"}, {"name": "Le sentier Le Corbusier", "commune": "Cap Martin", "lat": 43.7622, "lng": 7.5027, "region": "menton-monaco", "color": "#E8A33D", "url": "lieux/sentier-corbusier-cap-martin.html", "intro": "Un sentier côtier qui longe le Cap Martin là où l'architecte Le Corbusier avait sa cabanon de vacanc…"}, {"name": "La Colline du Château", "commune": "Nice", "lat": 43.6959, "lng": 7.2795, "region": "nice", "color": "#4FC3C9", "url": "lieux/colline-du-chateau-nice.html", "intro": "Le point le plus haut du Vieux Nice, où se dressait autrefois une forteresse aujourd'hui disparue, r…"}, {"name": "Le Cours Saleya et les ruelles du Vieux Nice", "commune": "Nice", "lat": 43.6953, "lng": 7.2764, "region": "nice", "color": "#4FC3C9", "url": "lieux/cours-saleya-vieux-nice.html", "intro": "Le cœur battant du Vieux Nice, où marché aux fleurs, façades ocre et ruelles en dédale composent l'i…"}, {"name": "Peillon, village suspendu", "commune": "Peillon", "lat": 43.7581, "lng": 7.3697, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/peillon-village.html", "intro": "Un village médiéval construit en pyramide sur un piton rocheux isolé, si photogénique qu'il apparaît…"}, {"name": "Peille, village de l'arrière-pays", "commune": "Peille", "lat": 43.7472, "lng": 7.4056, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/peille-village.html", "intro": "Un village authentique de l'arrière-pays niçois, moins visité que son voisin Peillon, avec un enchev…"}, {"name": "Gourdon, le nid d'aigle", "commune": "Gourdon", "lat": 43.7154, "lng": 6.9764, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/gourdon-village.html", "intro": "Un village accroché à 760 mètres d'altitude au bord d'une falaise verticale, avec une vue qui porte,…"}, {"name": "Les gorges du Loup et la cascade de Courmes", "commune": "Gorges du Loup", "lat": 43.7311, "lng": 6.9825, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/gorges-du-loup-cascade-courmes.html", "intro": "Un canyon calcaire creusé par la rivière Loup, ponctué de cascades et de marmites de géants sculptée…"}, {"name": "Pont du Loup et son viaduc", "commune": "Pont-du-Loup", "lat": 43.7186, "lng": 6.9967, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/pont-du-loup.html", "intro": "Un hameau niché au confluent de deux vallées, dominé par les arches en ruine d'un viaduc ferroviaire…"}, {"name": "Tourrettes-sur-Loup, la cité des violettes", "commune": "Tourrettes-sur-Loup", "lat": 43.7194, "lng": 7.0472, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/tourrettes-sur-loup.html", "intro": "Un village médiéval construit en arc de cercle au bord d'un plateau rocheux, célèbre pour la culture…"}, {"name": "Saint-Paul-de-Vence", "commune": "Saint-Paul-de-Vence", "lat": 43.697, "lng": 7.1214, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/saint-paul-de-vence.html", "intro": "Un village fortifié du XVIe siècle qui a attiré Matisse, Picasso et Chagall, devenu l'un des hauts l…"}, {"name": "Biot, le village des verriers", "commune": "Biot", "lat": 43.6289, "lng": 7.0967, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/biot-village-verrier.html", "intro": "Un village perché connu depuis les années 1950 pour sa verrerie artisanale, reconnaissable à ses bul…"}, {"name": "Le Haut-de-Cagnes", "commune": "Cagnes-sur-Mer", "lat": 43.6656, "lng": 7.1486, "region": "arriere-pays", "color": "#8FBF6B", "url": "lieux/haut-de-cagnes.html", "intro": "Un village médiéval qui surplombe directement la zone balnéaire moderne de Cagnes-sur-Mer, contraste…"}, {"name": "Le sentier du littoral du Cap d'Antibes", "commune": "Antibes", "lat": 43.5461, "lng": 7.1256, "region": "antibes-cannes", "color": "#E88B4F", "url": "lieux/sentier-cap-antibes.html", "intro": "Un sentier côtier appelé aussi Tirepoil, qui fait le tour de la pointe du Cap d'Antibes entre crique…"}, {"name": "La pinède Gould", "commune": "Juan-les-Pins", "lat": 43.5686, "lng": 7.1067, "region": "antibes-cannes", "color": "#E88B4F", "url": "lieux/pinede-gould-juan-les-pins.html", "intro": "Une pinède centenaire plantée directement sur le sable, où se tient chaque été l'un des plus anciens…"}, {"name": "Les îles de Lérins", "commune": "Cannes", "lat": 43.515, "lng": 7.048, "region": "antibes-cannes", "color": "#E88B4F", "url": "lieux/iles-de-lerins.html", "intro": "Deux îles au large de Cannes, accessibles en une vingtaine de minutes de bateau, qui semblent appart…"}, {"name": "Le Pic du Cap Roux", "commune": "Massif de l'Estérel", "lat": 43.4394, "lng": 6.8825, "region": "antibes-cannes", "color": "#E88B4F", "url": "lieux/pic-cap-roux-esterel.html", "intro": "Un sommet de 452 mètres dans le massif volcanique de l'Estérel, dont la roche rouge tranche violemme…"}, {"name": "Les calanques de l'Estérel", "commune": "Théoule-sur-Mer", "lat": 43.4956, "lng": 6.9364, "region": "antibes-cannes", "color": "#E88B4F", "url": "lieux/calanques-esterel-theoule.html", "intro": "Une succession de criques encaissées entre les roches rouges de l'Estérel, bien moins connues que le…"}, {"name": "La vieille ville de Grasse", "commune": "Grasse", "lat": 43.6584, "lng": 6.9228, "region": "golfe-st-tropez", "color": "#C97FA0", "url": "lieux/vieille-ville-grasse.html", "intro": "La capitale mondiale du parfum, dont la vieille ville en escalier cache un dédale de ruelles et de p…"}, {"name": "La Citadelle de Saint-Tropez", "commune": "Saint-Tropez", "lat": 43.2731, "lng": 6.6425, "region": "golfe-st-tropez", "color": "#C97FA0", "url": "lieux/citadelle-saint-tropez.html", "intro": "Une forteresse du XVIe siècle qui domine le port et tout le golfe de Saint-Tropez, à l'écart complet…"}, {"name": "Gassin, plus beau village de France", "commune": "Gassin", "lat": 43.2258, "lng": 6.5836, "region": "golfe-st-tropez", "color": "#C97FA0", "url": "lieux/gassin-plus-beau-village.html", "intro": "Un village perché classé parmi les plus beaux villages de France, à quelques kilomètres seulement de…"}];
    const map = L.map('map-full', { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
    const bounds = L.latLngBounds(SPOTS_MAP_FULL.map(s => [s.lat, s.lng]));
    map.fitBounds(bounds, { padding: [30, 30] });
    map.on('focus', () => map.scrollWheelZoom.enable());
    map.on('blur', () => map.scrollWheelZoom.disable());

    const infoCard = document.createElement('div');
    infoCard.className = 'map-info-card';
    infoCard.innerHTML =
      '<button class="map-info-close" aria-label="Fermer">×</button>' +
      '<img class="map-info-img" src="" alt="" loading="lazy">' +
      '<div class="map-info-body">' +
        '<span class="map-info-region"></span>' +
        '<span class="map-info-name"></span>' +
        '<p class="map-info-intro"></p>' +
        '<a class="map-info-link" href="">Voir la fiche →</a>' +
      '</div>';
    document.getElementById('map-full').appendChild(infoCard);
    L.DomEvent.disableClickPropagation(infoCard);
    L.DomEvent.disableScrollPropagation(infoCard);

    let closeTimer;
    function showCard(s) {
      clearTimeout(closeTimer);
      const slug = s.url.replace('lieux/', '').replace('.html', '');
      infoCard.querySelector('.map-info-img').src = s.img || 'https://picsum.photos/seed/' + slug + '/530/310';
      infoCard.querySelector('.map-info-img').alt = s.name;
      infoCard.querySelector('.map-info-region').textContent = s.commune;
      infoCard.querySelector('.map-info-name').textContent = s.name;
      infoCard.querySelector('.map-info-intro').textContent = s.intro;
      infoCard.querySelector('.map-info-link').href = s.url;
      infoCard.classList.add('is-open');
    }
    function hideCard() { infoCard.classList.remove('is-open'); }
    infoCard.querySelector('.map-info-close').addEventListener('click', hideCard);
    infoCard.addEventListener('mouseenter', () => clearTimeout(closeTimer));
    infoCard.addEventListener('mouseleave', () => { closeTimer = setTimeout(hideCard, 300); });
    map.on('click', hideCard);

    const groups = {};
    SPOTS_MAP_FULL.forEach(s => {
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:16px;height:16px;border-radius:50%;background:${s.color};border:2px solid #0C1116;box-shadow:0 1px 4px rgba(0,0,0,0.5);"></div>`,
        iconSize: [16, 16], iconAnchor: [8, 8],
      });
      const marker = L.marker([s.lat, s.lng], { icon });
      marker.on('mouseover', function() { clearTimeout(closeTimer); showCard(s); });
      marker.on('mouseout', function() { closeTimer = setTimeout(hideCard, 300); });
      marker.on('click', function() { map.panTo(this.getLatLng()); showCard(s); });
      if (!groups[s.region]) groups[s.region] = L.layerGroup();
      groups[s.region].addLayer(marker);
    });
    Object.values(groups).forEach(g => g.addTo(map));

    document.querySelectorAll('.legend-item[data-map="legend-full"]').forEach(item => {
      const region = item.dataset.region;
      const checkbox = item.querySelector('input');
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) { groups[region].addTo(map); } else { map.removeLayer(groups[region]); }
      });
    });
  })();
</script>

</body>
