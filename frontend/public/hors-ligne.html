<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C1116">
<title>Hors ligne — Riviera Secrète</title>
<!--
  Page de secours servie par le service worker quand une navigation échoue sans réseau
  (voir /sw.js, OFFLINE_URL).

  Fichier statique dans public/ et non une route Next, volontairement : le proxy next-intl
  localise toutes les routes sans extension, ce qui renvoyait un 404 sur /hors-ligne et
  faisait échouer addAll() à l'install du service worker. Un fallback hors ligne ne doit
  dépendre ni du routage ni du middleware — l'extension .html le fait sortir du matcher.
  Styles en ligne pour la même raison : aucune requête réseau ne doit être nécessaire.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: #0C1116; color: #ECEEF1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 420px; text-align: center; }
  .mark { font-size: 40px; margin: 0 0 16px; }
  h1 { font-size: 22px; margin: 0 0 12px; font-weight: 700; }
  p { font-size: 15px; line-height: 1.6; color: #8B96A1; margin: 0 0 8px; }
  p.en { font-size: 13px; margin: 0; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 12px 20px; border-radius: 999px; text-decoration: none;
    background: #4FC3C9; color: #0C1116; border: 1px solid #4FC3C9;
  }
  .btn.secondaire { background: transparent; color: #ECEEF1; border-color: rgba(255,255,255,0.5); }
  .btn:focus-visible { outline: 2px solid #4FC3C9; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <p class="mark" aria-hidden="true">🌊</p>
    <h1>Pas de réseau</h1>
    <p>
      Cette page n&rsquo;a pas encore été consultée, elle n&rsquo;est donc pas disponible
      hors ligne. Les pages que tu as déjà ouvertes restent accessibles.
    </p>
    <p class="en">No network — pages you already visited are still available offline.</p>
    <!--
      Cette page n'offrait aucune sortie : ni bouton de nouvelle tentative, ni retour à
      l'accueil. Or c'est un cul-de-sac par nature — une navigation qui a échoué — et le
      bouton retour du navigateur ramène sur la page d'où l'on vient, pas sur celle qu'on
      voulait. « Réessayer » relance l'URL demandée ; l'accueil, très probablement déjà en
      cache, sert de repli.
    -->
    <div class="actions">
      <button type="button" id="reessayer" class="btn">Réessayer · Retry</button>
      <a href="/" class="btn secondaire">Accueil · Home</a>
    </div>
  </main>
  <script>
    document.getElementById("reessayer").addEventListener("click", function () {
      location.reload();
    });
  </script>
</body>
</html>
